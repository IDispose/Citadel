name: Hosted Pages Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deployed-browser-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install pinned browser runtime
        run: bun add --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify deployed Citadel pages
        env:
          CITADEL_SITE_URL: https://sethgammon.github.io/Citadel
        run: bun scripts/hosted-site-smoke.js
